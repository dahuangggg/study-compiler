[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "study-compiler"
version = "0.2.0"
description = "A local-first, agent-guided learning compiler for Obsidian-compatible notes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Study Compiler contributors" }]
dependencies = []

[project.scripts]
study-compiler = "study_compiler.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/study-compiler/skills/learning-digest" = ["skills/learning-digest/SKILL.md"]
"share/study-compiler/skills/learning-digest/agents" = ["skills/learning-digest/agents/openai.yaml"]
"share/study-compiler/skills/learning-ingest" = ["skills/learning-ingest/SKILL.md"]
"share/study-compiler/skills/learning-ingest/agents" = ["skills/learning-ingest/agents/openai.yaml"]
"share/study-compiler/skills/learning-stage-commit" = ["skills/learning-stage-commit/SKILL.md"]
"share/study-compiler/skills/learning-stage-commit/agents" = ["skills/learning-stage-commit/agents/openai.yaml"]
"share/study-compiler/skills/lesson-draft" = ["skills/lesson-draft/SKILL.md"]
"share/study-compiler/skills/lesson-draft/agents" = ["skills/lesson-draft/agents/openai.yaml"]
"share/study-compiler/skills/recall-review" = ["skills/recall-review/SKILL.md"]
"share/study-compiler/skills/recall-review/agents" = ["skills/recall-review/agents/openai.yaml"]
